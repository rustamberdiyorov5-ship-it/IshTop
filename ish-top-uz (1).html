<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ISH TOP UZ</title>
<style>
  :root{
    --bg:#f4f6fb;--card:#fff;--text:#1b2233;--muted:#6b7488;--line:#e3e7f0;
    --primary:#1f6feb;--primary-d:#1757bd;--ok:#12a150;--bad:#d93030;--warn:#e69a00;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f1420;--card:#182033;--text:#e8ecf5;--muted:#93a0ba;--line:#26304a;}
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
  header{background:linear-gradient(135deg,#1f6feb,#12a1c0);color:#fff;padding:22px 16px;text-align:center}
  header h1{margin:0;font-size:24px;letter-spacing:.5px}
  header p{margin:6px 0 0;opacity:.9;font-size:14px}
  nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  nav button{flex:0 0 auto;border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;font-size:14px;cursor:pointer;white-space:nowrap}
  nav button.active{background:var(--primary);color:#fff}
  main{max-width:820px;margin:0 auto;padding:16px 14px 60px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .filters{display:grid;gap:10px;grid-template-columns:1fr 1fr}
  .filters .full{grid-column:1/-1}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);font:inherit}
  textarea{min-height:100px;resize:vertical}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  .btn{border:0;background:var(--primary);color:#fff;padding:11px 18px;border-radius:10px;font:inherit;cursor:pointer}
  .btn:hover{background:var(--primary-d)}
  .btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--primary)}
  .btn.ok{background:var(--ok)} .btn.bad{background:var(--bad)}
  .job h3{margin:0 0 8px;font-size:18px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .tag{font-size:12px;background:var(--bg);border:1px solid var(--line);padding:4px 9px;border-radius:999px;color:var(--muted)}
  .job p{margin:6px 0;line-height:1.5;font-size:14px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px}
  .empty{text-align:center;color:var(--muted);padding:40px 10px}
  .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center}
  .stat b{display:block;font-size:26px;color:var(--primary)}
  .status{font-size:12px;padding:3px 9px;border-radius:999px;color:#fff}
  .s-ACTIVE{background:var(--ok)} .s-PENDING{background:var(--warn)} .s-REJECTED{background:var(--bad)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1b2233;color:#fff;padding:11px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
  .toast.show{opacity:1}
  h2{margin:4px 0 14px;font-size:20px}
  .hidden{display:none}
</style>
</head>
<body>

<header>
  <h1>🇺🇿 ISH TOP UZ</h1>
  <p>O'zbekistonda o'zingizga mos ishni toping</p>
</header>

<nav id="nav">
  <button data-tab="search" class="active">🔎 Ish qidirish</button>
  <button data-tab="post">➕ Vakansiya joylash</button>
  <button data-tab="favs">⭐ Saqlanganlar</button>
  <button data-tab="mine">📋 E'lonlarim</button>
  <button data-tab="admin">👑 Admin</button>
  <button data-tab="help">ℹ️ Yordam</button>
</nav>

<main id="view"></main>
<div class="toast" id="toast"></div>

<script>
/* ---------- Sozlamalar ---------- */
const CATEGORIES = ["IT va dasturlash","Savdo va sotuv","Haydovchilik","Oshxona va restoran","Qurilish","Ofis ishlari","Ta'lim","Tibbiyot","Ishlab chiqarish","Boshqa kasblar"];
const REGIONS = ["Toshkent shahri","Toshkent viloyati","Andijon","Farg'ona","Namangan","Samarqand","Buxoro","Navoiy","Qashqadaryo","Surxondaryo","Jizzax","Sirdaryo","Xorazm","Qoraqalpog'iston"];
const ADMIN_PIN = "admin123"; // O'zgartiring!
const BOT_TOKEN = "9042178999:AAEP2oPuHpk_xYQN1kSF9NS3b9VfQvPnhlw";
const ADMIN_ID = ""; // Telegram chat ID ni shu yerga yozing (masalan: "123456789")

function tgSend(chatId, text){
  if(!BOT_TOKEN || !chatId) return;
  fetch("https://api.telegram.org/bot"+BOT_TOKEN+"/sendMessage",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({chat_id:chatId,text:text})
  }).catch(()=>{});
}

/* ---------- Ma'lumotlar (localStorage) ---------- */
const store = {
  get(k, d){ try{ return JSON.parse(localStorage.getItem("ishtop_"+k)) ?? d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("ishtop_"+k, JSON.stringify(v)); }catch(e){} }
};
let jobs = store.get("jobs", null);
if (!jobs) {
  jobs = [
    {id:uid(),created:Date.now()-86400000*2,title:"Sotuvchi-konsultant",category:"Savdo va sotuv",region:"Toshkent shahri",salary:"4–6 mln so'm",description:"Kiyim do'konida ishlash uchun faol, muloqotga ochiq xodim kerak. Ish jadvali 6/1.",contact:"+998 90 123 45 67",status:"ACTIVE"},
    {id:uid(),created:Date.now()-86400000,title:"Frontend dasturchi",category:"IT va dasturlash",region:"Samarqand",salary:"10–15 mln so'm",description:"React tajribasi kamida 1 yil. Masofaviy ish imkoniyati mavjud.",contact:"@hr_example",status:"ACTIVE"}
  ];
  store.set("jobs", jobs);
}
let favs = store.get("favs", []);
let isAdmin = store.get("admin", false);
const myId = store.get("me", null) || (()=>{ const i = uid(); store.set("me", i); return i; })();

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function save(){ store.set("jobs", jobs); store.set("favs", favs); }
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2200); }
const opts = (arr, ph) => `<option value="">${ph}</option>` + arr.map(x=>`<option>${esc(x)}</option>`).join("");

/* ---------- Navigatsiya ---------- */
let tab = "search";
document.getElementById("nav").addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  tab = b.dataset.tab;
  document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active", x===b));
  render();
});

function render(){
  const v = document.getElementById("view");
  ({search:renderSearch,post:renderPost,favs:renderFavs,mine:renderMine,admin:renderAdmin,help:renderHelp})[tab](v);
}

/* ---------- Ish qidirish ---------- */
let filter = {category:"",region:"",keyword:""};
function renderSearch(v){
  v.innerHTML = `
    <div class="card filters">
      <select id="fc">${opts(CATEGORIES,"📂 Barcha kasblar")}</select>
      <select id="fr">${opts(REGIONS,"📍 Barcha hududlar")}</select>
      <input id="fk" class="full" placeholder="🔍 Kalit so'z (masalan: sotuvchi)">
    </div>
    <div id="list"></div>`;
  const fc=v.querySelector("#fc"), fr=v.querySelector("#fr"), fk=v.querySelector("#fk");
  fc.value=filter.category; fr.value=filter.region; fk.value=filter.keyword;
  const upd=()=>{ filter={category:fc.value,region:fr.value,keyword:fk.value}; drawList(); };
  fc.onchange=fr.onchange=upd; fk.oninput=upd;
  drawList();
}
function drawList(){
  const q = filter.keyword.toLowerCase();
  const res = jobs.filter(j=>j.status==="ACTIVE"
    && (!filter.category||j.category===filter.category)
    && (!filter.region||j.region===filter.region)
    && (!q||[j.title,j.category,j.region,j.description].join(" ").toLowerCase().includes(q))
  ).sort((a,b)=>b.created-a.created);
  const el=document.getElementById("list");
  el.innerHTML = res.length
    ? `<p style="color:var(--muted);font-size:14px">🎯 Topilgan vakansiyalar: ${res.length}</p>` + res.map(jobCard).join("")
    : `<div class="empty">😕 So'rovingiz bo'yicha ish topilmadi.<br>Boshqa kasb yoki hududni sinab ko'ring.</div>`;
}
function jobCard(j, extra=""){
  const f = favs.includes(j.id);
  return `<div class="card job">
    <h3>💼 ${esc(j.title)}</h3>
    <div class="tags"><span class="tag">📂 ${esc(j.category)}</span><span class="tag">📍 ${esc(j.region)}</span><span class="tag">💰 ${esc(j.salary)}</span></div>
    <p>📝 ${esc(j.description)}</p>
    <p>📞 <b>${esc(j.contact)}</b></p>
    <div class="row"><span style="font-size:12px;color:var(--muted)">${new Date(j.created).toLocaleDateString("uz-UZ")}</span>
      <span>${extra}<button class="btn ghost" onclick="toggleFav('${j.id}')">${f?"★ Olib tashlash":"⭐ Saqlab qo'yish"}</button></span></div>
  </div>`;
}
function toggleFav(id){
  const i = favs.indexOf(id);
  if(i>-1){ favs.splice(i,1); toast("⭐ Saqlanganlardan olib tashlandi."); }
  else { favs.push(id); toast("⭐ Vakansiya saqlanganlarga qo'shildi!"); }
  save(); render();
}

/* ---------- Vakansiya joylash ---------- */
function renderPost(v){
  v.innerHTML = `<div class="card"><h2>➕ Yangi vakansiya</h2>
    <form id="pf">
      <label>1. Lavozim nomi</label><input name="title" required maxlength="100" placeholder="Sotuvchi, Dasturchi, Haydovchi...">
      <label>2. Kasb / soha</label><select name="category" required>${opts(CATEGORIES,"Tanlang")}</select>
      <label>3. Hudud</label><select name="region" required>${opts(REGIONS,"Tanlang")}</select>
      <label>4. Maosh</label><input name="salary" required maxlength="100" placeholder="5–7 mln so'm yoki kelishiladi">
      <label>5. Ish shartlari va talablar</label><textarea name="description" required maxlength="800"></textarea>
      <label>6. Telefon yoki Telegram username</label><input name="contact" required minlength="5" maxlength="100">
      <p style="font-size:13px;color:var(--muted)">⚠️ Kontakt tasdiqlangan e'londa ish qidiruvchilarga ko'rinadi.</p>
      <button class="btn" type="submit">Yuborish</button>
    </form></div>`;
  v.querySelector("#pf").onsubmit = e=>{
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    Object.keys(d).forEach(k=>d[k]=d[k].trim());
    jobs.push({id:uid(),created:Date.now(),owner:myId,...d,status:"PENDING"});
    tgSend(ADMIN_ID,
      "🆕 YANGI VAKANSIYA\n\n💼 "+d.title+"\n📂 "+d.category+"\n📍 "+d.region+
      "\n💰 "+d.salary+"\n📝 "+d.description+"\n📞 "+d.contact+
      "\n\nHolati: TEKSHIRILMOQDA (veb-saytdagi Admin bo'limida tasdiqlang)");
    save(); toast("✅ Vakansiyangiz qabul qilindi! Admin tekshiradi.");
    tab="mine"; document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.tab==="mine")); render();
  };
}

/* ---------- Saqlanganlar ---------- */
function renderFavs(v){
  const list = jobs.filter(j=>favs.includes(j.id)&&j.status==="ACTIVE");
  v.innerHTML = `<h2>⭐ Saqlangan vakansiyalar</h2>` + (list.length ? list.map(j=>jobCard(j)).join("") : `<div class="empty">Hozircha saqlangan vakansiyalaringiz yo'q.</div>`);
}

/* ---------- E'lonlarim ---------- */
const STATUS_UZ = {ACTIVE:"Faol",PENDING:"Tekshirilmoqda",REJECTED:"Rad etilgan"};
function renderMine(v){
  const list = jobs.filter(j=>j.owner===myId).sort((a,b)=>b.created-a.created);
  v.innerHTML = `<h2>📋 E'lonlarim</h2>` + (list.length ? list.map(j=>`<div class="card job">
    <div class="row" style="margin:0 0 8px"><h3 style="margin:0">${esc(j.title)}</h3><span class="status s-${j.status}">${STATUS_UZ[j.status]}</span></div>
    <div class="tags"><span class="tag">📂 ${esc(j.category)}</span><span class="tag">📍 ${esc(j.region)}</span><span class="tag">💰 ${esc(j.salary)}</span></div>
    <button class="btn bad" onclick="delJob('${j.id}')">🗑 O'chirish</button></div>`).join("") : `<div class="empty">Siz hali vakansiya joylamagansiz.</div>`);
}
function delJob(id){ if(!confirm("E'lon o'chirilsinmi?")) return; jobs=jobs.filter(j=>j.id!==id); save(); render(); }

/* ---------- Admin ---------- */
function renderAdmin(v){
  if(!isAdmin){
    v.innerHTML = `<div class="card"><h2>👑 Admin kirish</h2><label>Parol</label><input type="password" id="pin"><br><br><button class="btn" id="go">Kirish</button></div>`;
    v.querySelector("#go").onclick = ()=>{
      if(v.querySelector("#pin").value===ADMIN_PIN){ isAdmin=true; store.set("admin",true); render(); }
      else toast("Parol noto'g'ri!");
    };
    return;
  }
  const c = s=>jobs.filter(j=>j.status===s).length;
  const pending = jobs.filter(j=>j.status==="PENDING").sort((a,b)=>b.created-a.created);
  v.innerHTML = `<h2>👑 Admin panel</h2>
    <div class="stats">
      <div class="stat"><b>${jobs.length}</b>Jami vakansiyalar</div>
      <div class="stat"><b>${c("ACTIVE")}</b>Faol</div>
      <div class="stat"><b>${c("PENDING")}</b>Tekshirilayotgan</div>
      <div class="stat"><b>${c("REJECTED")}</b>Rad etilgan</div>
    </div>
    <h2 style="font-size:17px">🆕 Tasdiqlash kutayotganlar</h2>` +
    (pending.length ? pending.map(j=>jobCard(j,`<button class="btn ok" onclick="setStatus('${j.id}','ACTIVE')">✅</button> <button class="btn bad" onclick="setStatus('${j.id}','REJECTED')">❌</button> `).replace(/<button class="btn ghost"[^>]*>.*?<\/button>/,"")).join("") : `<div class="empty">Kutayotgan e'lonlar yo'q.</div>`) +
    `<br><button class="btn ghost" onclick="isAdmin=false;store.set('admin',false);render()">Chiqish</button>`;
}
function setStatus(id,s){
  const j=jobs.find(x=>x.id===id); if(!j||j.status!=="PENDING") return;
  j.status=s; save(); toast(s==="ACTIVE"?"Tasdiqlandi!":"Rad etildi!"); render();
}

/* ---------- Yordam ---------- */
function renderHelp(v){
  v.innerHTML = `<div class="card"><h2>ℹ️ ISH TOP UZ yordam</h2>
    <p>🔎 <b>Ish qidirish</b> — kasb, hudud yoki kalit so'z bo'yicha vakansiyalarni topish.</p>
    <p>➕ <b>Vakansiya joylash</b> — yangi e'lon yuborish. Admin tasdiqlagach e'lon chiqadi.</p>
    <p>⭐ <b>Saqlanganlar</b> — sevimli ishlar ro'yxati.</p>
    <p>📋 <b>E'lonlarim</b> — o'zingiz joylagan e'lonlar holati.</p>
    <p style="color:var(--muted);font-size:13px">Ma'lumotlar shu brauzerda (localStorage) saqlanadi.</p></div>`;
}

render();
</script>
</body>
</html>
